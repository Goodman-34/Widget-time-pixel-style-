# Membangun aplikasi Native Windows (Neutralinojs) di server GitHub.
name: Build Windows installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Download Neutralino Binaries
        run: npx neu update

      - name: Build Neutralino App
        run: npx neu build

      - name: Create Portable EXE
        shell: pwsh
        run: |
          cmd /c copy /b dist\PixelDriveClock\PixelDriveClock-win_x64.exe + dist\PixelDriveClock\resources.neu dist\PixelDriveClock-1.0.2-portable.exe

      - name: Compile Inno Setup (setup.exe)
        shell: pwsh
        run: iscc setup.iss

      - name: Tampilkan hasil
        shell: pwsh
        run: Get-ChildItem dist -Filter *.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelDriveClock-windows
          path: |
            dist/PixelDriveClock-1.0.2-setup.exe
            dist/PixelDriveClock-1.0.2-portable.exe
          retention-days: 30

      - name: Lampirkan ke Releases (hanya saat ada tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PixelDriveClock-1.0.2-setup.exe
            dist/PixelDriveClock-1.0.2-portable.exe
          draft: false
          generate_release_notes: true
