# Membangun installer Windows di server GitHub.
#
# Kenapa ada berkas ini: rilis web akan dikemas otomatis dalam bentuk zip.
#
# Cara memakai:
#   1. Buat tag versi, lalu dorong ke GitHub:
#         git tag v1.0.0
#         git push origin v1.0.0
#      Installer akan dibangun dan otomatis dilampirkan ke halaman Releases.
#
#   2. Atau jalankan manual dari tab "Actions" -> "Build Windows installer"
#      -> "Run workflow". Hasilnya bisa diunduh sebagai artifact.

name: Build Web Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Ambil kode
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Pasang dependensi
        run: npm ci

      - name: Periksa sprite, font, dan palet
        run: npm run validate

      - name: Buat ikon
        run: npm run icon

      - name: Bangun rilis web (Zip)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $version = "${{ github.ref_name }}"
          if ($version -eq "") { $version = "latest" }
          # Hapus 'v' awalan jika ada
          $version = $version -replace '^v', ''
          Compress-Archive -Path "src/renderer/*" -DestinationPath "dist/PixelDriveClock-${version}.zip" -Force

      - name: Tampilkan hasil
        shell: pwsh
        run: Get-ChildItem dist -Filter *.zip | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}}

      - name: Simpan sebagai artifact
        uses: actions/upload-artifact@v4
        with:
          name: PixelDriveClock-web
          path: dist/*.zip
          retention-days: 30

      - name: Lampirkan ke Releases (hanya saat ada tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          draft: false
          generate_release_notes: true
